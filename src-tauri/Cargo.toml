[package]
name = "sotto"
version = "1.0.0"
description = "YouTube videos offline with Russian voice-over"
license = "MIT"
edition = "2021"
default-run = "sotto"

[lib]
name = "sotto_lib"
path = "src/lib.rs"

[[bin]]
name = "sotto"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "macos-system-configuration"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = true
